version: "3.8"

services:
  ai_core:
    image: manhmitcf/dat_lab_management_aicore:windows-local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dat_lab_deepstream_local
    runtime: nvidia
    restart: "no"
    entrypoint: ["bash", "/workspace/ai_core/docker_entrypoint.sh"]
    command: ["python3", "main.py"]

    env_file:
      - ./.env

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    volumes:
      - .:/workspace/ai_core
      - ./videos:/workspace/ai_core/videos:ro
      - ./output:/workspace/ai_core/output
      - ./pretrained:/workspace/ai_core/pretrained
      - ./config:/workspace/ai_core/config
